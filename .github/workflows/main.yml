
name: Build PRINCE JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: gradle :app:assembleDebug -Pkotlin.jvm.target.validation.mode=warning
          unzip -q PRINCE_JARVIS_AndroidStudio.zip -d extracted
          ls -la extracted/PRINCE_JARVIS

      - name: Build APK
        working-directory: extracted/PRINCE_JARVIS
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRINCE-JARVIS-APK
          path: extracted/PRINCE_JARVIS/app/build/outputs/apk/debug/app-debug.apk
